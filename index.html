  <script>
    // ===== Service Worker 登録 + 自動更新 =====
    (function () {
      if (!('serviceWorker' in navigator)) return;

      const pageLoadTime = Date.now();

      // ロード直後（5秒以内）→ 透過的に自動更新、それ以降 → 何もしない（次回ロード時に自動適用）
      function handleUpdate(worker) {
        if (Date.now() - pageLoadTime < 5000) {
          worker.postMessage('skipWaiting');
        }
      }

      // skipWaiting 後にリロード（ただしユーザーが他ページへ遷移中なら抑止）
      let reloading = false;
      let userNavigating = false;
      // 内部リンククリック・フォーム送信を検知してフラグを立てる（リロードがナビを上書きするのを防止）
      document.addEventListener('click', (e) => {
        const a = e.target.closest('a[href]');
        if (a && !a.target && !e.defaultPrevented) {
          try {
            const url = new URL(a.href, location.href);
            if (url.origin === location.origin && url.pathname !== location.pathname) {
              userNavigating = true;
            }
          } catch (_) {}
        }
      }, true);
      window.addEventListener('beforeunload', () => { userNavigating = true; });
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading || userNavigating) return;
        reloading = true;
        window.location.reload();
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' })
          .then(reg => {
            console.log('✅ Service Worker登録成功:', reg.scope);
            // ページロード時点で待機中のSWがあれば即自動更新
            if (reg.waiting) handleUpdate(reg.waiting);
            // インストール中のSWを監視
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  handleUpdate(newWorker);
                }
              });
            });
          })
          .catch(err => console.log('❌ Service Worker登録失敗:', err));
      });
    })();
  </script>
