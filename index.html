<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="twitter:description" content="いつものおさんぽがワクワクする冒険に！300種類以上のお題、写真でマーク、合言葉で友達と同じボードを共有。">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VDM84JMFJ0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VDM84JMFJ0');
  </script>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9788669862817063"
     crossorigin="anonymous"></script>
  <link rel="stylesheet" href="landing.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    /* ===== ヒーロー内のstats+CTAを縦積みに ===== */
    .hero-content {
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 400px;
    }

    /* ===== キャッチコピー ===== */
    .hero-catchcopy {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 800;
      color: #1a4a2e;
      text-shadow: 0 1px 0 rgba(255,255,255,0.7);
      line-height: 1.5;
      letter-spacing: 0.02em;
      text-align: center;
    }
    .hero-subcopy {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: #3a6a4a;
      text-shadow: 0 1px 0 rgba(255,255,255,0.5);
      line-height: 1.7;
      text-align: center;
    }

    /* ===== body の固定ヘッダー分パディングをリセット（index.htmlにはヘッダーなし） ===== */
    body { padding-top: 0; }

    /* ===== ロゴモードヒーロー ===== */
    .hero-logo-mode {
      background: #ffffff;
      padding: 16px 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .hero-logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .hero-logo-img {
      display: block;
      width: min(480px, calc(100vw - 48px));
      height: auto;
    }
    .hero-cta-strip-logo {
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 0;
      padding: 0 24px 8px;
      background: none;
      border: none;
      box-shadow: none;
    }
    .hero-cta-strip-logo .btn-start {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* ===== キャッチチップ（ヒーロー直下） ===== */
    .stat-chips {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .stat-chip {
      background: rgba(255,255,255,0.9);
      border: 1.5px solid rgba(126,184,154,0.5);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 700;
      color: #2e6648;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    /* ===== 説明画像セクション共通 ===== */
    .lp-section-img {
      margin-bottom: 16px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 14px rgba(0,0,0,0.09);
    }
    .lp-img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="landing-container">

    <!-- ヒーロー -->
    <section class="hero hero-logo-mode" aria-label="メインビジュアル">
      <div class="hero-logo-wrap">
        <img src="static/osanpo-bingo-battle.png" alt="おさんぽビンゴ ロゴ。ビンゴグリッドに並んだお散歩アイテムと、バトルモードバッジ。" class="hero-logo-img">
      </div>
      <div class="hero-cta-strip-logo">
        <a href="game.html" class="btn-start"><span class="btn-sub">おさんぽビンゴ</span><span class="btn-main">START</span></a>
      </div>
    </section>

    <!-- メインコンテンツ -->
    <section class="main-content">

      <!-- 遊び方 -->
      <div class="lp-section-img">
        <img src="static/howto-banner.png" alt="遊び方：ゲームをスタートして、お題を見つけて写真で記録、BINGOを目指そう！" class="lp-img">
      </div>

      <!-- バトルモード -->
      <div class="lp-section-img">
        <img src="static/battlemode.png" alt="バトルモード：合言葉で友達・家族と同じボードでバトル！" class="lp-img">
      </div>

      <!-- カメラで記録 -->
      <div class="lp-section-img">
        <img src="static/camera.png" alt="見つけたお題をカメラで記録しよう" class="lp-img">
      </div>

      <!-- 難易度 -->
      <div class="lp-section-img">
        <img src="static/Difficultylevel.png" alt="5つの難易度：かんたん・ふつう・むずかしい・おに・ガチおに" class="lp-img">
      </div>

      <!-- フィールド -->
      <div class="lp-section-img">
        <img src="static/field.png" alt="選べるフィールド：まち・しぜん・こうえんなど" class="lp-img">
      </div>

      <!-- フリー入力 -->
      <div class="lp-section-img">
        <img src="static/FREEMASU.png" alt="フリー入力マスで好きなお題で遊べる" class="lp-img">
      </div>

      <!-- 広告枠（インフィード）※PV増加後に表示 -->
      <div class="ad-slot ad-slot-infeed" id="adSlotInfeed">
        <div class="ad-slot-inner">
          <span class="ad-slot-label">広告</span>
          <div class="ad-placeholder">
            <p class="ad-placeholder-text">AD</p>
            <p class="ad-placeholder-sub">レスポンシブ広告</p>
          </div>
        </div>
      </div>

      <!-- CTA -->
      <div class="cta-bottom hero-cta-strip-logo">
        <a href="game.html" class="btn-start btn-large"><span class="btn-sub">おさんぽビンゴ</span><span class="btn-main">START</span></a>
      </div>
    </section>

    <!-- フッター -->
    <footer class="footer">
      <p>© 2026 おさんぽビンゴ　<span class="dot">・</span>　アプリ不要・無料　<span class="dot">・</span>　<a href="privacy.html" style="color:inherit;opacity:0.7;text-decoration:none;">プライバシーポリシー</a>　<span class="dot">・</span>　<a href="terms.html" style="color:inherit;opacity:0.7;text-decoration:none;">利用規約</a></p>
    </footer>

    <!-- 広告枠（フッター上）※PV増加後に表示 -->
    <div class="ad-slot ad-slot-footer" id="adSlotFooter">
      <div class="ad-slot-inner">
        <span class="ad-slot-label">広告</span>
        <div class="ad-placeholder ad-placeholder-banner">
          <p class="ad-placeholder-text">AD</p>
          <p class="ad-placeholder-sub">728 × 90</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' })
          .then(reg => console.log('✅ Service Worker登録成功:', reg.scope))
          .catch(err => console.log('❌ Service Worker登録失敗:', err));
      });
    }
  </script>
</body>
</html>
