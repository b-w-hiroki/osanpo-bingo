name: Security regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install workbook test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/python-tests"
          "$RUNNER_TEMP/python-tests/bin/python" -m pip install --disable-pip-version-check pandas==2.3.3 openpyxl==3.1.5
          echo "PYTHON=$RUNNER_TEMP/python-tests/bin/python" >> "$GITHUB_ENV"
      - name: Run repository tests
        run: npm test
      - name: Run restored-board browser regression
        run: |
          command -v google-chrome
          npm run test:browser
